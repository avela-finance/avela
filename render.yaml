services:
  - type: web
    name: avela-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: XLAYER_RPC_URL
        value: https://rpc.xlayer.tech
      - key: PORT
        value: 3001
      - key: AVELA_VAULT_ADDRESS
        sync: false
      - key: AVELA_ROUTER_ADDRESS
        sync: false
      - key: SIGNER_PRIVATE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
