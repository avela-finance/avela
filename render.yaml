services:
  - type: web
    name: avela-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: avela-db
          property: connectionString
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: XLAYER_RPC_URL
        value: https://rpc.xlayer.tech
      - key: PORT
        value: 3001
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

databases:
  - name: avela-db
    plan: starter
    databaseName: avela
    user: avela
