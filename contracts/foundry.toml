[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
xlayer = "${XLAYER_RPC_URL}"

[etherscan]
xlayer = { key = "${ETHERSCAN_API_KEY}", url = "https://www.okx.com/web3/explorer/xlayer/api" }
